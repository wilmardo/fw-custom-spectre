pins:
  # Molex 48-pin ECU connector p/n 5007620481 - see readme.md for the full pin table

  # Injector outputs
  - id: D12
    class: outputs
    ts_name: Injector 1 (Pin 32)

  - id: D13
    class: outputs
    ts_name: Injector 2 (Pin 44)

  - id: D14
    class: outputs
    ts_name: Injector 3 (Pin 28)

  - id: D15
    class: outputs
    ts_name: Injector 4 (Pin 24)

  - id: E9
    class: outputs
    ts_name: Injector 5 (Pin 7)

  - id: E11
    class: outputs
    ts_name: Injector 6 (Pin 8)

  - id: E14
    class: outputs
    ts_name: Injector 7 (Pin 6)

  - id: E13
    class: outputs
    ts_name: Injector 8 (Pin 5)

  # Ignition outputs
  - id: D7
    class: outputs
    ts_name: Ignition 1 (Pin 13)

  - id: B9
    class: outputs
    ts_name: Ignition 2 (Pin 31)

  - id: A8
    class: outputs
    ts_name: Ignition 3 (Pin 36)

  - id: D10
    class: outputs
    ts_name: Ignition 4 (Pin 40)

  - id: D9
    class: outputs
    ts_name: Ignition 5 (Pin 22, JP18 must be bridged - default is GND)

  - id: B7
    class: outputs
    ts_name: Ignition 6 (Pin 26, JP16 must be bridged - default is GND)

  # Trigger inputs (VR/Hall selectable per-channel via JP2/JP3, conditioned by on-board MAX9926)
  - id: [E0, E0]
    class: [switch_inputs, event_inputs]
    ts_name: VR/Hall 1 (Pins 43/42)

  - id: [E1, E1]
    class: [switch_inputs, event_inputs]
    ts_name: VR/Hall 2 (Pins 41/39)

  # Analog sensor inputs
  - id: EFI_ADC_12
    class: analog_inputs
    ts_name: MAP (Pin 25)

  - id: EFI_ADC_13
    class: analog_inputs
    ts_name: CLT (Pin 27)

  - id: EFI_ADC_10
    class: analog_inputs
    ts_name: IAT (Pin 17)

  - id: EFI_ADC_11
    class: analog_inputs
    ts_name: TPS (Pin 35)

  - id: EFI_ADC_14
    class: analog_inputs
    ts_name: O2 Primary (Pin 23)

  - id: EFI_ADC_9
    class: analog_inputs
    ts_name: BARO - external sensor input (Pin 10)

  - id: EFI_ADC_15
    class: analog_inputs
    ts_name: On-board Battery Sense (PC5)

  # Spare analog inputs - freely repurposable, wired as CLT_2/IAT_2/O2_2 alternates on the board
  - id: EFI_ADC_0
    class: analog_inputs
    ts_name: Spare Analog Input 1 / IAT_2 (Pin 18)

  - id: EFI_ADC_4
    class: analog_inputs
    ts_name: Spare Analog Input 2 / O2_2 (Pin 14)

  - id: EFI_ADC_1
    class: analog_inputs
    ts_name: Spare Analog Input 3 / CLT_2 (Pin 20)

  # Digital/frequency input
  - id: D4
    class: switch_inputs
    ts_name: Flex Fuel Input (Pin 38)

  # Auxiliary outputs
  - id: E6
    class: outputs
    ts_name: Fan (Pin 15)

  - id: E3
    class: outputs
    ts_name: Fuel Pump (Pin 19)

  - id: C13
    class: outputs
    ts_name: Tacho Out (Pin 48)

  - id: C6
    class: outputs
    ts_name: Boost Out (Pin 47)

  - id: B13
    class: outputs
    ts_name: Spare 1 Out (Pin 12, JP7 default position)

  - id: B12
    class: outputs
    ts_name: Spare 2 Out (Pin 11, JP6 default position)

  # Idle - 2-wire PWM solenoid outputs (default JP5/JP8 jumper state)
  - id: C7
    class: outputs
    ts_name: Idle 1 Out (Pin 9)

  - id: D3
    class: outputs
    ts_name: Idle 2 Out (Pin 16)

  # Idle - DRV8825 stepper control lines (alternate build, JP5-JP8 bridged to STEP_xx)
  - id: E5
    class: outputs
    ts_name: Idle Stepper STEP

  - id: E7
    class: outputs
    ts_name: Idle Stepper DIR

  - id: E2
    class: outputs
    ts_name: Idle Stepper EN
